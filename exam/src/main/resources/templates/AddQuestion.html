<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload Question</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Upload Question</h2>
    <form th:action="@{/upload-question}" th:object="${questionRequestDTO}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="questionContent">Question Content (Text):</label>
            <input type="text" class="form-control" th:field="*{questionContent}" required>
            <label for="questionContentFile">Question Content (Image):</label>
            <input type="file" class="form-control" th:field="*{questionContentFile}" accept="image/*">
        </div>

        <div class="form-group">
            <label for="optionA">Option A (Text):</label>
            <input type="text" class="form-control" th:field="*{optionA}" required>
            <label for="optionAFile">Option A (Image):</label>
            <input type="file" class="form-control" th:field="*{optionAFile}" accept="image/*">
        </div>

        <div class="form-group">
            <label for="optionB">Option B (Text):</label>
            <input type="text" class="form-control" th:field="*{optionB}" required>
            <label for="optionBFile">Option B (Image):</label>
            <input type="file" class="form-control" th:field="*{optionBFile}" accept="image/*">
        </div>

        <div class="form-group">
            <label for="optionC">Option C (Text):</label>
            <input type="text" class="form-control" th:field="*{optionC}" required>
            <label for="optionCFile">Option C (Image):</label>
            <input type="file" class="form-control" th:field="*{optionCFile}" accept="image/*">
        </div>

        <div class="form-group">
            <label for="optionD">Option D (Text):</label>
            <input type="text" class="form-control" th:field="*{optionD}" required>
            <label for="optionDFile">Option D (Image):</label>
            <input type="file" class="form-control" th:field="*{optionDFile}" accept="image/*">
        </div>

        <div class="form-group">
            <label for="correctAnswer">Correct Answer (Text):</label>
            <input type="text" class="form-control" th:field="*{correctAnswer}" required>
            <label for="correctAnswerFile">Correct Answer (Image):</label>
            <input type="file" class="form-control" th:field="*{correctAnswerFile}" accept="image/*">
        </div>

        <div class="form-group">
            <label for="topic">Topic:</label>
            <input type="text" class="form-control" th:field="*{topic}" required>
        </div>

        <input type="hidden" th:name="collegeId" value="1"> <!-- Set college ID dynamically as needed -->

        <button type="submit" class="btn btn-primary">Upload Question</button>
        
        <div th:if="${message}" class="alert alert-success mt-3" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>
    </form>
</div>
</body>
</html>
