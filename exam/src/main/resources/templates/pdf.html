<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Questions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script>
        function toggleInputPair(fileInputId, textInputId) {
            const fileInput = document.getElementById(fileInputId);
            const textInput = document.getElementById(textInputId);

            fileInput.addEventListener('change', function() {
                textInput.disabled = !!fileInput.value; // Disable text if file is selected
            });

            textInput.addEventListener('input', function() {
                fileInput.disabled = !!textInput.value; // Disable file if text is entered
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            toggleInputPair('questionFile', 'questionText');
            toggleInputPair('optionAFile', 'optionAText');
            toggleInputPair('optionBFile', 'optionBText');
            toggleInputPair('optionCFile', 'optionCText');
            toggleInputPair('optionDFile', 'optionDText');
            toggleInputPair('correctAnswerFile', 'correctAnswerText');
        });
    </script>
</head>
<body>
    <div class="container mt-5">
        <h2>Add a Single Question</h2>
        <form th:action="@{/api/questions/add}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="collegeId" class="form-label">College ID</label>
                <input type="number" id="collegeId" name="collegeId" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="topic" class="form-label">Topic</label>
                <input type="text" id="topic" name="topic" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="questionFile" class="form-label">Question (File)</label>
                <input type="file" id="questionFile" name="question" class="form-control">
                <label for="questionText" class="form-label">or Question (Text)</label>
                <input type="text" id="questionText" name="questionText" class="form-control">
            </div>

            <div class="mb-3">
                <label for="optionAFile" class="form-label">Option A (File)</label>
                <input type="file" id="optionAFile" name="optionA" class="form-control">
                <label for="optionAText" class="form-label">or Option A (Text)</label>
                <input type="text" id="optionAText" name="optionAText" class="form-control">
            </div>

            <div class="mb-3">
                <label for="optionBFile" class="form-label">Option B (File)</label>
                <input type="file" id="optionBFile" name="optionB" class="form-control">
                <label for="optionBText" class="form-label">or Option B (Text)</label>
                <input type="text" id="optionBText" name="optionBText" class="form-control">
            </div>

            <div class="mb-3">
                <label for="optionCFile" class="form-label">Option C (File)</label>
                <input type="file" id="optionCFile" name="optionC" class="form-control">
                <label for="optionCText" class="form-label">or Option C (Text)</label>
                <input type="text" id="optionCText" name="optionCText" class="form-control">
            </div>

            <div class="mb-3">
                <label for="optionDFile" class="form-label">Option D (File)</label>
                <input type="file" id="optionDFile" name="optionD" class="form-control">
                <label for="optionDText" class="form-label">or Option D (Text)</label>
                <input type="text" id="optionDText" name="optionDText" class="form-control">
            </div>

            <div class="mb-3">
                <label for="correctAnswerFile" class="form-label">Correct Answer (File)</label>
                <input type="file" id="correctAnswerFile" name="correctAnswerFile" class="form-control">
                <label for="correctAnswerText" class="form-label">or Correct Answer (Text)</label>
                <input type="text" id="correctAnswerText" name="correctAnswerText" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">Add Question</button>
        </form>
    </div>
</body>
</html>
